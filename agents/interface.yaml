interface:
  display_name: "Lvsea Draw Boss"
  short_description: "Route, validate, and add native editable PPTX companions to visual artifacts"
  default_prompt: "Use $lvsea-draw to route this Chinese diagram, infographic, or visual explainer request to the best available provider and deliver an editable, validated artifact plus a native editable PPTX companion whenever a canonical SVG or static HTML visual is produced."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
